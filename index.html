<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Program • Sebastian</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{margin:0;padding:0;height:100%;font-family:'Inter',sans-serif;background:#0a0e17;color:#c9d1d9;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none;}
  #clouds{position:fixed;top:0;width:100%;height:180px;pointer-events:none;z-index:1;opacity:0.32;}
  .cloud{position:absolute;animation:drift linear infinite;filter:brightness(0.8);}
  @keyframes drift{from{left:-600px}to{left:100vw}}
  .overlay{position:fixed;inset:0;background:linear-gradient(transparent 0%,rgba(10,14,23,0.96)100%);pointer-events:none;z-index:2;}

  .corner{position:fixed;top:28px;left:28px;background:rgba(15,20,35,0.7);padding:22px 32px;border-radius:32px;backdrop-filter:blur(24px);z-index:100;border:1px solid rgba(80,100,140,0.15);box-shadow:0 15px 40px rgba(0,0,0,0.6);font-weight:300;}
  .countdown{font-size:34px;color:#a3b4d8;line-height:1.3;letter-spacing:1px;}
  .live-clock{font-size:16px;color:#7f92b8;margin-top:6px;}
  .corner .info{font-size:13px;color:#6f82a8;margin-top:12px;line-height:1.6;}

  .panel{width:92%;max-width:960px;height:90vh;background:rgba(18,24,42,0.82);padding:56px 52px;border-radius:40px;backdrop-filter:blur(28px);border:1px solid rgba(80,100,140,0.18);box-shadow:0 35px 100px rgba(0,0,0,0.75);z-index:10;position:relative;display:flex;flex-direction:column;}
  .panel-content{flex:1;overflow-y:auto;padding-right:8px;}
  .panel-content::-webkit-scrollbar{width:6px;}
  .panel-content::-webkit-scrollbar-track{background:transparent;}
  .panel-content::-webkit-scrollbar-thumb{background:rgba(140,160,210,0.3);border-radius:3px;}

  h1{font-size:52px;font-weight:300;letter-spacing:4px;text-align:center;margin-bottom:6px;color:#d0d8e8;}
  .subtitle{font-size:18px;text-align:center;opacity:0.7;margin-bottom:44px;font-weight:300;color:#8b9bc0;}

  .tabs{display:flex;gap:22px;margin-bottom:44px;flex-wrap:wrap;justify-content:center;}
  .tab{padding:13px 36px;background:rgba(80,100,140,0.1);border-radius:50px;cursor:pointer;transition:0.35s;font-weight:400;font-size:15px;color:#a3b4d8;border:1px solid rgba(80,100,140,0.2);}
  .tab:hover{background:rgba(120,140,180,0.15);}
  .tab.active{background:rgba(140,160,210,0.25);color:#e6edf3;font-weight:500;border:none;}

  /* rest of your styles exactly the same */
  .home-grid{max-width:720px;margin:0 auto;display:grid;gap:28px;}
  .quote-box{background:rgba(80,100,140,0.08);border:1px solid rgba(120,140,180,0.2);border-radius:28px;padding:36px 32px;text-align:center;transition:0.4s;}
  .quote-box:hover{border-color:rgba(140,160,210,0.4);}
  #homeQuote{font-size:26px;line-height:1.5;font-style:italic;color:#c9d1d9;}
  .shuffle-btn{margin-top:20px;background:rgba(120,140,180,0.15);border:1px solid rgba(140,160,210,0.3);color:#c9d1d9;padding:12px 32px;border-radius:50px;font-size:15px;transition:0.35s;cursor:pointer;}
  .shuffle-btn:hover{background:rgba(140,160,210,0.25);}

  .quick-card{background:rgba(80,100,140,0.08);border:1px solid rgba(120,140,180,0.2);border-radius:24px;padding:24px;transition:0.35s;}
  .quick-card:hover{border-color:rgba(140,160,210,0.4);background:rgba(120,140,180,0.1);}
  .quick-card h3{font-size:19px;margin-bottom:12px;color:#a3b4d8;}

  .check-item{background:rgba(80,100,140,0.06);border:1px solid rgba(120,140,180,0.18);padding:19px 28px;border-radius:24px;margin:16px 0;transition:0.35s;cursor:pointer;}
  .check-item:hover{border-color:rgba(140,160,210,0.4);}
  .check-item input{display:none;}
  .check-item label{display:flex;align-items:center;gap:20px;font-size:18px;font-weight:400;color:#c9d1d9;cursor:pointer;}
  .check-item .box{width:34px;height:34px;border:2px solid #8b9bc0;border-radius:12px;transition:0.3s;background:transparent;}
  .check-item input:checked + label .box{background:#8b9bc0;box-shadow:0 0 18px rgba(139,155,192,0.5);}

  #timerDisplay{font-size:5.8rem;font-weight:300;color:#c9d1d9;letter-spacing:-2px;margin:50px 0 20px;}
  .timer-quote{font-size:18px;font-style:italic;opacity:0.65;margin-bottom:30px;}
  .timer-btn{background:rgba(120,140,180,0.12);border:1px solid rgba(140,160,210,0.25);color:#c9d1d9;padding:14px 26px;border-radius:50px;font-size:1.15rem;min-width:100px;transition:0.35s;cursor:pointer;}
  .timer-btn:hover{background:rgba(140,160,210,0.25);}
  .stop-btn{background:#b83a4b;color:#f0e6e8;padding:15px 46px;border-radius:50px;font-size:1.4rem;margin-top:32px;cursor:pointer;}

  .easter{position:fixed;font-size:78px;opacity:0.035;pointer-events:none;z-index:0;animation:float 32s infinite linear;color:#6f82a8;font-weight:300;}
  @keyframes float{0%{transform:translateY(100vh) rotate(0deg);}100%{transform:translateY(-200px) rotate(360deg);}}
  .version{position:fixed;bottom:14px;right:18px;font-size:8px;color:#ffffff06;z-index:99;}
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div id="clouds"></div>
<div class="overlay"></div>

<div class="corner">
  <div class="countdown" id="countdown">Loading...</div>
  <div class="live-clock" id="clock">--:--</div>
  <div class="info">The Program • Sebastian<br>Winter Abs & Arms • Dec 21</div>
</div>

<div class="panel">
  <h1>THE PROGRAM</h1>
  <p class="subtitle">31 Days • No Equipment • Pure Consistency</p>

  <div class="tabs">
    <div class="tab active" data-tab="home">Home</div>
    <div class="tab" data-tab="morning">Morning</div>
    <div class="tab" data-tab="workout">Workout</div>
    <div class="tab" data-tab="timer">Timer</div>
    <div class="tab" data-tab="morningRoutine">Morning Routine</div>
  </div>

  <div class="panel-content">
    <!-- All your content goes here now so it can scroll inside the panel -->
    <div id="home" class="content">
      <!-- same as before -->
      <div class="home-grid"> ... </div>
    </div>

    <div id="morning" class="content hidden"> ... </div>
    <div id="workout" class="content hidden"> ... </div>
    <div id="timer" class="content hidden text-center"> ... </div>
    <div id="morningRoutine" class="content hidden"> ... </div>
  </div>
</div>

<!-- easter eggs, version, audio same as before -->
<div class="easter">peace</div><div class="easter">quiet</div><div class="easter">winter</div><div class="easter">stillness</div><div class="easter">strength</div>
<div class="version">v5.1</div>

<audio id="rain" loop preload="auto">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-rain-and-thunder-1249.mp3" type="audio/mpeg">
</audio>

<script>
// ← All the working code from v5.0 (rain, timer, countdown, Friday checklist, etc.) →

// NEW: Prevent default wheel scrolling + use it only for tab switching
let scrollCooldown = false;
window.addEventListener('wheel', (e) => {
  e.preventDefault(); // ← THIS IS KEY: stops the page from scrolling
  if (scrollCooldown) return;
  scrollCooldown = true;
  setTimeout(() => scrollCooldown = false, 350);

  const tabs = ['home','morning','workout','timer','morningRoutine'];
  if (e.deltaY > 0) {
    currentTabIndex = (currentTabIndex + 1) % tabs.length;
  } else {
    currentTabIndex = (currentTabIndex - 1 + tabs.length) % tabs.length;
  }
 切换Tab(currentTabIndex);
}, { passive: false }); // important for preventDefault to work

// Rest of your flawless script (exactly the same as v5.0)
const tabs = ['home','morning','workout','timer','morningRoutine'];
let currentTabIndex = 0;

function switchTab(index){
  document.querySelectorAll('.content').forEach(c=>c.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(tabs[index]).classList.remove('hidden');
  document.querySelector(`.tab[data-tab="${tabs[index]}"]`).classList.add('active');
  currentTabIndex = index;
}

// click tabs still work
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    const id = tab.getAttribute('data-tab');
    currentTabIndex = tabs.indexOf(id);
    switchTab(currentTabIndex);
  });
});

// ← all the rest (rain, timer, countdown, workouts, etc.) exactly as before →
</script>
</body>
</html>
